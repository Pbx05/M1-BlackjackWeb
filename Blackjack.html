<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minijuego Blackjack</title>
    <link rel="stylesheet" href="Blackjack.css">
    <script src="Blackjack.js" defer></script>
</head>
<body>
    <main class="mesaJuego">
        <h1>Blackjack</h1>

        <!-- Zona del crupier -->
        <section class="zonaJuego">
            <h2>Crupier - Puntos: 
                <span id="puntuacionCrupier">0</span>
            </h2>

            <div class="cartas" id="cartasCrupier"></div>
        </section>

        <!-- Zona del jugador -->
        <section class="zonaJuego">
            <h2>Jugador - Puntos:          
                <span id="puntuacionJugador">0</span>
            </h2>

            <div class="cartas" id="cartasJugador"></div>
        </section> 

        <!-- Mensajes -->
        <p id="mensajeAvisos"></p>

        <!-- Botones -->
        <div class="controles">
            <button class="botones" id="botonPedir">Pedir Carta</button>
            <button class="botones" id="botonPlantarse">Plantarse</button>
        </div>
    </main>

    <div class="ventanaOculta" id="ventanaFinPartida">
        <div class="contenidoVentanaOculta">
            <h2 id="mensajeFinPartida"></h2>

            <div class="puntuacionesFinales">
                <p>Crupier: <span id="puntosFinalesCrupier">0</span></p>
                <p>Jugador: <span id="puntosFinalesJugador">0</span></p>
            </div>

            <p id="mensajeSecreto">Pista: pulsa la tecla 'd' para activar el modo oscuro VIP.</p>

            <button id="botonReiniciar" class="botones">Jugar de nuevo</button>
        </div>
    </div>

</body>
</html>
